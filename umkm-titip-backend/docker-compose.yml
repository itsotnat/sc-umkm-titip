# Sesuai arsitektur deployment di dokumen SAD Bagian 5 dan
# Deployment & Maintenance Guide: 3 container terpisah (app, db, nginx).
# Jalankan: docker compose up -d --build

services:
  app:
    build: .
    container_name: umkm_titip_app
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - uploads_data:/usr/src/app/uploads
    expose:
      - "3000"

  db:
    image: postgres:16-alpine
    container_name: umkm_titip_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    expose:
      - "5432"

  nginx:
    image: nginx:alpine
    container_name: umkm_titip_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  db_data:
  uploads_data:
  certbot_www:
  certbot_conf:
