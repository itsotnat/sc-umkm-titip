# Reverse proxy dasar. Setelah sertifikat SSL didapat lewat certbot
# (lihat dokumen Deployment & Maintenance Guide Bagian 4), tambahkan
# blok server 443 dengan ssl_certificate mengarah ke /etc/letsencrypt/live/umkmtitip.store/.

server {
    listen 80;
    server_name umkmtitip.store;

    # Batas upload foto profil (aplikasi sudah mengompres foto, ini sekadar pengaman).
    client_max_body_size 5m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
