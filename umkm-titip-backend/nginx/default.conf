# Reverse proxy + HTTPS. Sertifikat SSL didapat via certbot (webroot method,
# lihat dokumen Deployment & Maintenance Guide Bagian 4) dan disimpan di
# volume `certbot_conf` (/etc/letsencrypt di dalam container ini).
# Perpanjangan otomatis dijadwalkan lewat cron (certbot renew + nginx reload).

server {
    listen 80;
    server_name api-backend.umkm-titip.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-backend.umkm-titip.web.id;

    ssl_certificate /etc/letsencrypt/live/api-backend.umkm-titip.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-backend.umkm-titip.web.id/privkey.pem;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
